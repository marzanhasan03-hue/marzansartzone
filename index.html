<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marzan's Art Zone</title>
<meta name="description" content="Original artwork and art courses at Marzan's Art Zone by Marzan Hasan.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#fdfaf3;
  --ink:#15120f;
  --muted:#665d52;
  --card:#faf2de;
  --line:#e6d7b3;
  --accent:#9a7222;
  --accent-ink:#f3d98b;
}

body{
  background:linear-gradient(180deg,#fffdf8 0%,#f8efd9 100%) fixed;
}

.hero{
  background:
  radial-gradient(circle at 85% 20%,#f1dfa8 0,transparent 45%),
  radial-gradient(circle at 5% 90%,#ead2d8 0,transparent 40%);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{scroll-behavior:smooth}

body{
  font-family:Inter,system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink);
  line-height:1.6;
}

h1,h2,h3{
  font-family:Fraunces,Georgia,serif;
  font-weight:600;
  line-height:1.1;
  letter-spacing:-.01em;
}

a{color:inherit}

.wrap{
  max-width:1100px;
  margin:0 auto;
  padding:0 20px;
}

section{padding:84px 0}

.eyebrow{
  font-size:.78rem;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--accent);
  font-weight:600;
  margin-bottom:12px;
}

h2{
  font-size:clamp(2rem,4.5vw,3rem);
  margin-bottom:14px;
}

.lead{
  color:var(--muted);
  max-width:56ch;
  margin-bottom:40px;
}

/* Navigation */

header{
  position:sticky;
  top:0;
  z-index:10;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}

nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  height:64px;
}

.logo{
  font-family:Fraunces,serif;
  font-size:1.25rem;
  font-weight:600;
  text-decoration:none;
}

nav ul{
  display:flex;
  gap:26px;
  list-style:none;
}

nav ul a{
  text-decoration:none;
  font-size:.92rem;
  color:var(--muted);
}

nav ul a:hover{color:var(--ink)}

.menu-btn{
  display:none;
  background:none;
  border:1px solid var(--line);
  color:var(--ink);
  border-radius:8px;
  padding:6px 12px;
  font:inherit;
  cursor:pointer;
}

@media(max-width:720px){
  .menu-btn{display:block}

  nav ul{
    display:none;
    position:absolute;
    top:64px;
    left:0;
    right:0;
    background:var(--bg);
    flex-direction:column;
    gap:0;
    border-bottom:1px solid var(--line);
  }

  nav ul.open{display:flex}

  nav ul a{
    display:block;
    padding:14px 20px;
  }
}

/* Buttons */

.btn{
  display:inline-block;
  padding:13px 26px;
  border-radius:999px;
  background:linear-gradient(135deg,#1c1713,#2e241a);
  box-shadow:inset 0 0 0 1px #c9a227;
  color:var(--accent-ink);
  text-decoration:none;
  font-weight:600;
  font-size:.95rem;
  border:0;
  cursor:pointer;
  font-family:inherit;
  transition:transform .15s;
}

.btn:hover{transform:translateY(-2px)}

.btn.ghost{
  background:transparent;
  color:var(--ink);
  border:1.5px solid var(--line);
}
</style>
