<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marzan's Art Zone</title>
<meta name="description" content="Original artwork and art courses at Marzan's Art Zone by Marzan Hasan.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============ EDIT YOUR COLORS HERE ============ */
  :root{
    --bg:#fdfaf3; --ink:#15120f; --muted:#665d52; --card:#faf2de;
    --line:#e6d7b3; --accent:#9a7222; --accent-ink:#f3d98b;
  }
  body{background:linear-gradient(180deg,#fffdf8 0%,#f8efd9 100%) fixed}
  .hero{background:radial-gradient(circle at 85% 20%,#f1dfa8 0,transparent 45%),radial-gradient(circle at 5% 90%,#ead2d8 0,transparent 40%)}
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
  h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;line-height:1.1;letter-spacing:-.01em}
  a{color:inherit}
  .wrap{max-width:1100px;margin:0 auto;padding:0 20px}
  section{padding:84px 0}
  .eyebrow{font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:12px}
  h2{font-size:clamp(2rem,4.5vw,3rem);margin-bottom:14px}
  .lead{color:var(--muted);max-width:56ch;margin-bottom:40px}

  /* nav */
  header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  nav{display:flex;align-items:center;justify-content:space-between;height:64px}
  .logo{font-family:Cinzel,"Trajan Pro",Georgia,serif;font-size:1.12rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;white-space:nowrap;background:linear-gradient(100deg,#4a3207 0%,#b8892f 35%,#e8c668 50%,#b8892f 65%,#4a3207 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:logoshine 6s ease-in-out infinite}
  @keyframes logoshine{0%,100%{background-position:100% 0}50%{background-position:-20% 0}}
  .cart-btn{white-space:nowrap}
  @media(max-width:520px){.logo{font-size:.74rem;letter-spacing:.05em}}
  @media(prefers-reduced-motion:reduce){.logo{animation:none}}
  nav ul{display:flex;gap:26px;list-style:none}
  nav ul a{text-decoration:none;font-size:.92rem;color:var(--muted)}
  nav ul a:hover{color:var(--ink)}
  .menu-btn{display:none;background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
  @media(max-width:720px){
    .menu-btn{display:block}
    nav ul{display:none;position:absolute;top:64px;left:0;right:0;background:var(--bg);flex-direction:column;gap:0;border-bottom:1px solid var(--line)}
    nav ul.open{display:flex}
    nav ul a{display:block;padding:14px 20px}
  }

  /* buttons */
  .btn{display:inline-block;padding:13px 26px;border-radius:999px;background:linear-gradient(135deg,#1c1713,#2e241a);box-shadow:inset 0 0 0 1px #c9a227;color:var(--accent-ink);text-decoration:none;font-weight:600;font-size:.95rem;border:0;cursor:pointer;font-family:inherit;transition:transform .15s}
  .btn:hover{transform:translateY(-2px)}
  .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}

  /* hero */
  .hero{padding:80px 0 60px}
  .hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
  .hero h1{font-size:clamp(2.8rem,7vw,5.2rem);margin-bottom:22px}
  .hero h1 em{color:var(--accent);font-weight:400}
  .hero p{color:var(--muted);font-size:1.1rem;max-width:46ch;margin-bottom:30px}
  .hero .actions{display:flex;gap:12px;flex-wrap:wrap}
  .hero-art{aspect-ratio:4/5;border-radius:200px 200px 16px 16px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
  .hero-art img,.hero-art svg{width:100%;height:100%;object-fit:cover;display:block}
  @media(max-width:820px){.hero-grid{grid-template-columns:1fr}.hero-art{max-width:380px}}

  /* about */
  .about-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
  .about-grid p{color:var(--muted);margin-bottom:16px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}
  .stat{border-top:2px solid var(--ink);padding-top:10px}
  .stat b{font-family:Fraunces,serif;font-size:2rem;display:block}
  .stat span{color:var(--muted);font-size:.85rem}
  @media(max-width:820px){.about-grid{grid-template-columns:1fr}}

  /* artwork shop */
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
  .chip{padding:8px 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.88rem;cursor:pointer}
  .chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px}
  .art{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .art .img{aspect-ratio:4/5;overflow:hidden;background:var(--line)}
  .art .img img,.art .img svg{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
  .art:hover .img img,.art:hover .img svg{transform:scale(1.05)}
  .art .body{padding:18px;display:flex;flex-direction:column;gap:6px;flex:1}
  .art h3{font-size:1.2rem}
  .art .meta{color:var(--muted);font-size:.85rem}
  .art .row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:12px}
  .price{font-weight:600;font-size:1.1rem}
  .art .btn{padding:8px 18px;font-size:.85rem}
  .sold{opacity:.6}
  .tag{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

  /* courses */
  #courses{background:var(--card);border-block:1px solid var(--line)}
  .course{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:26px;display:flex;flex-direction:column;gap:10px}
  .course .level{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
  .course h3{font-size:1.4rem}
  .course p{color:var(--muted);font-size:.95rem}
  .course ul{list-style:none;font-size:.9rem;display:grid;gap:4px;margin:6px 0}
  .course li::before{content:"✓ ";color:var(--accent);font-weight:700}
  .course .row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
  .course .grid-sm{display:grid}

  /* contact */
  .contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px}
  form{display:grid;gap:14px}
  label{font-size:.85rem;font-weight:500;display:grid;gap:6px}
  input,select,textarea{font:inherit;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
  .contact-list{list-style:none;display:grid;gap:14px;margin-top:20px}
  .contact-list a{text-decoration:none;border-bottom:1px solid var(--line)}
  .contact-list a:hover{color:var(--accent)}
  @media(max-width:820px){.contact-grid{grid-template-columns:1fr}}

  footer{padding:30px 0;border-top:1px solid var(--line);color:var(--muted);font-size:.88rem}
  footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
  .reveal{opacity:0;transform:translateY(18px);transition:.7s}
  .reveal.in{opacity:1;transform:none}
  @media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}

  /* ============ ENTRANCE ANIMATIONS ============ */
  #intro{position:fixed;inset:0;z-index:100;background:#fbf5e6;display:grid;place-items:center;overflow:hidden;transition:transform .9s cubic-bezier(.77,0,.18,1)}
  #intro.hide{transform:translateY(-100%)}
  #intro .blob{position:absolute;border-radius:50%;box-shadow:0 20px 50px rgba(60,40,10,.25),inset 0 0 30px rgba(255,255,255,.25);animation:pop 1.2s cubic-bezier(.2,.8,.2,1) both}
  #intro .b1{width:38vmin;height:38vmin;background:linear-gradient(135deg,#6d1a36,#9b2c4d);left:8%;top:12%}
  #intro .b2{width:30vmin;height:30vmin;background:linear-gradient(135deg,#f6e3a1,#c9a227 55%,#8a6d12);right:10%;top:20%;animation-delay:.15s}
  #intro .b3{width:46vmin;height:46vmin;background:linear-gradient(135deg,#0f3d34,#1f6b58);right:22%;bottom:-8%;animation-delay:.3s}
  #intro .b4{width:20vmin;height:20vmin;background:linear-gradient(135deg,#fff3d6,#e3c98a);left:18%;bottom:8%;animation-delay:.45s}
  #intro h1{position:relative;font-family:Cinzel,"Trajan Pro",Georgia,serif;font-weight:600;font-size:clamp(1.9rem,6.4vw,4.2rem);letter-spacing:.14em;text-transform:uppercase;line-height:1.25;text-align:center;padding:0 20px;animation:rise .9s .5s cubic-bezier(.2,.8,.2,1) both}
  #intro #intro-name{display:inline-block;background:linear-gradient(100deg,#5a3d0a 0%,#b8892f 30%,#f0d27a 50%,#b8892f 70%,#5a3d0a 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 14px rgba(251,245,230,.95));animation:shine 3.2s ease-in-out .9s infinite}
  @keyframes shine{0%{background-position:100% 0}100%{background-position:-100% 0}}
  #intro h1 span{display:block;font-family:Inter,sans-serif;font-size:.2em;letter-spacing:.45em;text-transform:uppercase;font-weight:600;margin-top:18px;color:var(--accent)}
  @keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:.9}}
  @keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
  @keyframes drop{from{opacity:0;transform:translateY(-100%)}to{opacity:1;transform:none}}
  @keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-18px) rotate(6deg)}}
  @keyframes arch{from{opacity:0;transform:scale(.85);clip-path:inset(100% 0 0 0 round 200px 200px 16px 16px)}to{opacity:1;transform:none;clip-path:inset(0 0 0 0 round 200px 200px 16px 16px)}}
  header{animation:drop .8s 2s both}
  .hero .eyebrow,.hero h1,.hero p,.hero .actions{animation:rise .9s both}
  .hero .eyebrow{animation-delay:2.1s}.hero h1{animation-delay:2.25s}.hero p{animation-delay:2.4s}.hero .actions{animation-delay:2.55s}
  .hero-art{animation:arch 1.2s 2.2s cubic-bezier(.2,.8,.2,1) both}
  .hero{position:relative;overflow:hidden}
  .float{position:absolute;border-radius:50%;opacity:.7;box-shadow:0 12px 30px rgba(60,40,10,.2);z-index:0;animation:float 7s ease-in-out infinite,rise 1s 2.6s both;pointer-events:none}
  .hero .wrap{position:relative;z-index:1}
  .f1{width:90px;height:90px;background:linear-gradient(135deg,#f6e3a1,#c9a227 55%,#8a6d12);left:-30px;top:2%}
  .f2{width:50px;height:50px;background:linear-gradient(135deg,#6d1a36,#9b2c4d);right:6%;bottom:10%;animation-delay:1s,2.6s}
  .f3{width:70px;height:70px;background:linear-gradient(135deg,#0f3d34,#1f6b58);left:45%;bottom:4%;animation-delay:2s,2.6s}
  .btn{position:relative;overflow:hidden}
  .btn::after{content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg)}
  .btn:hover::after{left:140%;transition:left .7s}
  @media(prefers-reduced-motion:reduce){
    #intro{display:none}
    header,.hero .eyebrow,.hero h1,.hero p,.hero .actions,.hero-art,.float{animation:none!important}
  }


  /* ============ STORE: CART, MODAL, SHOP TOOLS ============ */
  .nav-right{display:flex;gap:8px;align-items:center}
  .cart-btn{display:flex;gap:8px;align-items:center;background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:.9rem;cursor:pointer}
  .cart-btn:hover{border-color:var(--accent)}
  .cart-btn b{background:var(--ink);color:#f3d98b;border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center;font-size:.75rem;padding:0 5px}
  .scrim{position:fixed;inset:0;background:rgba(20,15,10,.5);z-index:60;opacity:0;pointer-events:none;transition:opacity .3s}
  .scrim.show{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--bg);z-index:61;transform:translateX(100%);transition:transform .35s;display:flex;flex-direction:column;border-left:1px solid var(--line)}
  .drawer.show{transform:none}
  .drawer-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
  .drawer-head h3{font-size:1.4rem}
  .drawer-body{flex:1;overflow:auto;padding:8px 20px}
  .drawer-foot{padding:16px 20px;border-top:1px solid var(--line);display:grid;gap:10px;background:var(--card);max-height:60vh;overflow:auto}
  .x{background:none;border:0;font-size:1.8rem;cursor:pointer;color:var(--ink);line-height:1;padding:0 4px}
  .ci{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
  .ci img,.ci .ph{width:64px;height:80px;object-fit:cover;border-radius:8px;background:var(--line)}
  .ci b{display:block;font-family:Fraunces,serif;font-size:1.05rem}
  .linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;font-size:.85rem;padding:0}
  .total{display:flex;justify-content:space-between;font-weight:600;font-size:1.15rem}
  .small{font-size:.82rem;color:var(--muted)}
  .modal{position:fixed;inset:0;z-index:70;display:none;place-items:center;padding:20px;background:rgba(20,15,10,.6)}
  .modal.show{display:grid}
  .modal-card{background:var(--bg);border-radius:16px;max-width:860px;width:100%;max-height:92vh;overflow:auto;display:grid;grid-template-columns:1fr 1fr}
  .modal-card .mi{background:var(--line);min-height:300px}
  .modal-card .mi img,.modal-card .mi svg{width:100%;height:100%;object-fit:cover;display:block}
  .modal-card .mt{padding:26px;display:flex;flex-direction:column;gap:10px}
  .modal-card .mt h3{font-size:1.9rem}
  .modal-card .mt p{color:var(--muted);white-space:pre-line}
  @media(max-width:720px){.modal-card{grid-template-columns:1fr}.modal-card .mi{min-height:240px;max-height:50vh}}
  .shop-tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;align-items:center}
  .shop-tools input,.shop-tools select{padding:9px 16px;border-radius:999px;font-size:.9rem}
  .shop-tools input{min-width:200px}
  .art .img{cursor:zoom-in;position:relative}
  .art h3 button{background:none;border:0;font:inherit;color:inherit;cursor:pointer;text-align:left;padding:0}
  .art h3 button:hover{color:var(--accent)}
  .ribbon{position:absolute;top:12px;left:12px;background:#1c1713;color:#f3d98b;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;padding:4px 12px;border-radius:999px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#1c1713;color:#f3d98b;padding:12px 22px;border-radius:999px;z-index:300;opacity:0;transition:.3s;pointer-events:none;font-size:.9rem;max-width:92vw;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .empty{color:var(--muted);padding:30px 0}
  .admin-link{opacity:.5;font-size:.8rem;margin-left:12px}
  .admin-link:hover{opacity:1}
  .btn.sm{padding:7px 14px;font-size:.82rem}
  .btn.light{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
  .btn.danger{background:#8b1d2c;box-shadow:none;color:#fff}

  /* ============ ADMIN PANEL ============ */
  body.noscroll{overflow:hidden}
  #admin{position:fixed;inset:0;z-index:200;background:#f7f3ea;overflow:auto;display:none}
  #admin.show{display:block}
  .ad-top{position:sticky;top:0;background:#1c1713;color:#f3d98b;display:flex;justify-content:space-between;align-items:center;padding:12px 20px;gap:12px;z-index:2;flex-wrap:wrap}
  .ad-top strong{font-family:Fraunces,serif;font-size:1.15rem;font-weight:600}
  .ad-top .ad-actions{gap:10px}
  .ad-top .linkbtn{color:#f3d98b}
  .ad-tabs{display:flex;gap:4px;flex-wrap:wrap;background:#fff;border-bottom:1px solid var(--line);padding:0 14px}
  .ad-tabs button{background:none;border:0;padding:14px 16px;font:inherit;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent}
  .ad-tabs button.on{color:var(--ink);border-color:var(--accent);font-weight:600}
  .ad-body{max-width:980px;margin:0 auto;padding:26px 20px 90px}
  .ad-body h3{font-size:1.6rem;margin-bottom:6px}
  .ad-body h4{font-family:Fraunces,serif;font-size:1.15rem;margin:22px 0 10px}
  .ad-sub{color:var(--muted);margin-bottom:20px;font-size:.92rem}
  .ad-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
  .ad-row{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center}
  .ad-row img,.ad-row .ph{width:64px;height:80px;object-fit:cover;border-radius:8px;background:var(--line)}
  .ad-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .ad-grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:700px){.ad-grid2{grid-template-columns:1fr}.ad-row{grid-template-columns:56px 1fr}.ad-row .ad-actions{grid-column:1/-1}}
  .badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.72rem;font-weight:600;background:#eee}
  .badge.ok{background:#e1f0e6;color:#14532d}.badge.sold{background:#f3dcdc;color:#7f1d1d}.badge.warn{background:#fff0c2;color:#6b4e00}
  .ad-login{max-width:380px;margin:12vh auto;padding:30px;background:#fff;border:1px solid var(--line);border-radius:16px;display:grid;gap:14px}
  .photo-prev{width:170px;aspect-ratio:3/4;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--line);display:block}
  .note{background:#fff7dd;border:1px solid #ecd68b;border-radius:10px;padding:12px 14px;font-size:.88rem;margin-bottom:16px}
  .price-in{width:110px;padding:7px 10px}
  .ad-form{display:grid;gap:14px}
  .check{display:flex;align-items:center;gap:10px;font-weight:500}
  .check input{width:20px;height:20px}
  .steps{padding-left:20px;display:grid;gap:8px;margin:10px 0 18px}

  /* collections */
  .col-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px}
  .col-card{position:relative;display:block;width:100%;aspect-ratio:4/5;border:0;padding:0;border-radius:18px;overflow:hidden;cursor:pointer;text-align:left;color:#fff;font:inherit;background:linear-gradient(135deg,#6d1a36,#0f3d34);box-shadow:0 1px 0 var(--line),0 12px 30px -18px rgba(60,40,10,.5);transition:transform .35s,box-shadow .35s}
  .col-card:nth-child(3n+2){background:linear-gradient(135deg,#0f3d34,#8a6d12)}
  .col-card:nth-child(3n+3){background:linear-gradient(135deg,#8a6d12,#6d1a36)}
  .col-card:hover{transform:translateY(-6px);box-shadow:0 22px 40px -18px rgba(60,40,10,.6)}
  .col-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s}
  .col-card:hover img{transform:scale(1.07)}
  .col-card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,10,5,0) 35%,rgba(15,10,5,.86) 100%)}
  .col-card .ct{position:absolute;left:0;right:0;bottom:0;padding:22px;z-index:1}
  .col-card h3{font-size:1.5rem;color:#fff;margin-bottom:6px}
  .col-card p{font-size:.88rem;opacity:.88;line-height:1.45;margin-bottom:10px}
  .col-card .cnt{display:inline-block;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:#f3d98b;border-top:1px solid rgba(243,217,139,.6);padding-top:8px}

  /* ratings, reviews & student gallery */
  .stars{color:#c9a227;letter-spacing:1px;font-size:.95rem;white-space:nowrap}.stars .off{color:#dccfae}
  .rate-line{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted);flex-wrap:wrap}
  .rev-box{margin-top:8px;border-top:1px solid var(--line);padding-top:10px;display:grid;gap:8px}
  .rev-list{display:grid;gap:10px}.rev{border-top:1px dashed var(--line);padding-top:8px;font-size:.9rem}
  .rev p{margin:2px 0 0;color:var(--muted);white-space:pre-line}
  .starpick{display:flex;gap:2px}.starpick button{background:none;border:0;font-size:1.8rem;line-height:1;cursor:pointer;color:#dccfae;padding:0 2px}.starpick button.on{color:#c9a227}
  .revform{display:grid;gap:8px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card)}
  .revform .row2{display:flex;gap:8px;flex-wrap:wrap}
  .stu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
  .stu{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:zoom-in;text-align:left;padding:0;font:inherit;color:inherit;display:flex;flex-direction:column}
  .stu .img{aspect-ratio:1/1;background:var(--line);overflow:hidden}
  .stu .img img,.stu .img svg{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
  .stu:hover .img img{transform:scale(1.05)}
  .stu .body{padding:14px 16px;display:grid;gap:3px}.stu h3{font-size:1.1rem}
</style>

<script>
(function(){
'use strict';
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const getPath = (o,p) => p.split('.').reduce((x,k) => x == null ? x : x[k], o);
const setPath = (o,p,v) => { const k=p.split('.'), l=k.pop(); k.reduce((x,i)=>x[i], o)[l]=v; };
const url = u => /^https?:\/\//i.test(u) ? u : 'https://' + u;

/* ---------- data (published file + optional unpublished draft from the admin) ---------- */
const BASE = JSON.parse($('#site-data').textContent);
const DKEY = 'marzan-art-draft-v1', CKEY = 'marzan-art-cart-v1';
let DATA = clone(BASE), dirty = false;
try { const d = JSON.parse(localStorage.getItem(DKEY) || 'null'); if (d && d.base === BASE.version) { DATA = d.data; dirty = true; } } catch(e){}
if (!DATA.collections) { DATA.collections = clone(BASE.collections || []); DATA.content.colTitle = DATA.content.colTitle || BASE.content.colTitle; DATA.content.colText = DATA.content.colText || BASE.content.colText; }

function ensure(){
  DATA.students = DATA.students || []; DATA.reviews = DATA.reviews || [];
  DATA.content = Object.assign({stuTitle:"Our students' artwork", stuText:'Proud moments from the students in my courses.'}, DATA.content);
}
ensure();
const money = n => DATA.settings.currency + Number(n || 0).toLocaleString('en-US');
const findArt = id => DATA.artworks.find(a => a.id === id);
const findCourse = id => DATA.courses.find(c => c.id === id);
let toastT;
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),3200); }

function persist(){
  dirty = true;
  try { localStorage.setItem(DKEY, JSON.stringify({base:BASE.version, data:DATA})); return true; }
  catch(e){ toast('Browser storage is full. Download your website now so you do not lose changes.'); return false; }
}
let rt;
function commit(){ persist(); clearTimeout(rt); rt=setTimeout(renderSite,200); updateDirtyUI(); }

/* ---------- storefront rendering ---------- */
const HERO_SVG = '<svg viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Abstract artwork"><rect width="400" height="500" fill="#efe2c2"/><circle cx="270" cy="170" r="110" fill="#6d1a36"/><circle cx="130" cy="330" r="150" fill="#0f3d34"/><path d="M0 400 Q120 300 220 380 T400 330 V500 H0Z" fill="#c9a227" opacity=".92"/><circle cx="300" cy="400" r="46" fill="#fbf5e6"/></svg>';
const PH = '<svg viewBox="0 0 200 250" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="200" height="250" fill="#efe2c2"/><circle cx="130" cy="90" r="50" fill="#6d1a36"/><circle cx="70" cy="170" r="60" fill="#0f3d34" opacity=".9"/></svg>';
const artImg = a => a.image ? `<img src="${esc(a.image)}" alt="${esc(a.title)}" loading="lazy">` : PH;

function renderSite(){
  const S = DATA.settings, C = DATA.content;
  document.title = S.siteName;
  $('#logo').textContent = S.siteName;
  const inn = $('#intro-name'); if (inn) inn.textContent = S.siteName;
  $('#foot-text').textContent = `© ${new Date().getFullYear()} ${S.siteName} — ${S.ownerName}. All artworks are copyrighted.`;

  // hero
  $('#hero-eyebrow').textContent = C.eyebrow;
  $('#hero-title').innerHTML = esc(C.headline).replace(/\*(.+?)\*/g, '<em>$1</em>');
  $('#hero-text').textContent = C.heroText;
  $('#hero-actions').innerHTML = `<a class="btn" href="#artworks">Shop artworks</a><a class="btn ghost" href="#courses">${S.coursesOpen ? 'Explore courses' : 'Courses coming soon'}</a>`;
  $('#hero-art').innerHTML = C.heroImage ? `<img src="${esc(C.heroImage)}" alt="">` : HERO_SVG;

  // about
  $('#about-title').textContent = C.aboutTitle;
  $('#about-text').innerHTML = [C.aboutP1, C.aboutP2, C.aboutP3].filter(Boolean).map(p => `<p>${esc(p)}</p>`).join('');
  $('#about-stats').innerHTML = C.stats.filter(s => s.value || s.label).map(s => `<div class="stat"><b>${esc(s.value)}</b><span>${esc(s.label)}</span></div>`).join('');

  renderCollections(); renderStudents(); renderShop(); renderCourses(); renderContact(); renderCart();
}

const shop = {cat:'All', q:'', sort:'featured'};
function renderCollections(){
  const C = DATA.content, list = DATA.collections || [];
  $('#col-title').textContent = C.colTitle || 'Explore by style'; $('#col-text').textContent = C.colText || '';
  $('#col-grid').innerHTML = list.map(c => {
    const arts = DATA.artworks.filter(a => a.category === c.name), cover = c.image || (arts.find(a => a.image) || {}).image || '';
    return `<button class="col-card" data-act="col-go" data-id="${esc(c.id)}" aria-label="${esc(c.name)}">${cover ? `<img src="${esc(cover)}" alt="" loading="lazy">` : ''}
      <span class="ct"><h3>${esc(c.name)}</h3>${c.desc ? `<p>${esc(c.desc)}</p>` : ''}<span class="cnt">${arts.length ? arts.length + (arts.length === 1 ? ' artwork' : ' artworks') : 'Coming soon'}</span></span></button>`;
  }).join('');
  $('#collections').style.display = list.length ? '' : 'none';
  const nc = $('#nav-col'); if (nc) nc.parentElement.style.display = list.length ? '' : 'none';
}
const revsFor = id => DATA.reviews.filter(x => x.artId === id);
const avgOf = id => { const l = revsFor(id); return l.length ? l.reduce((t,x) => t + Number(x.stars), 0) / l.length : 0; };
const starStr = n => { n = Math.max(0, Math.min(5, Math.round(n))); return `<span class="stars">${'★'.repeat(n)}<span class="off">${'★'.repeat(5-n)}</span></span>`; };
const rateLine = id => { const l = revsFor(id); return l.length ? `<div class="rate-line">${starStr(avgOf(id))} <span>${avgOf(id).toFixed(1)} (${l.length})</span></div>` : ''; };
function renderStudents(){
  const C = DATA.content, list = DATA.students;
  $('#stu-title').textContent = C.stuTitle; $('#stu-text').textContent = C.stuText;
  $('#stu-grid').innerHTML = list.map(s => `<button class="stu" data-act="stu-open" data-id="${esc(s.id)}">
    <div class="img">${s.image ? `<img src="${esc(s.image)}" alt="${esc(s.title || 'Student artwork')}" loading="lazy">` : PH}</div>
    <div class="body"><span class="tag">${esc(s.course || 'Student artwork')}</span><h3>${esc(s.title || 'Untitled')}</h3><span class="small">by ${esc(s.name)}</span></div></button>`).join('');
  $('#students').style.display = list.length ? '' : 'none';
  const n = $('#nav-stu'); if (n) n.parentElement.style.display = list.length ? '' : 'none';
}
function card(a){
  const sold = a.status === 'sold', inCart = cart.includes(a.id);
  return `<article class="art ${sold?'sold':''}">
    <div class="img" data-act="open" data-id="${esc(a.id)}">${artImg(a)}${sold?'<span class="ribbon">Sold</span>':''}</div>
    <div class="body">
      <span class="tag">${esc(a.category)}</span>
      <h3><button data-act="open" data-id="${esc(a.id)}">${esc(a.title)}</button></h3>
      <span class="meta">${esc(a.medium)}</span>${rateLine(a.id)}
      <div class="row">
        <span class="price">${sold ? 'Sold' : money(a.price)}</span>
        ${sold ? '' : inCart ? `<button class="btn light" data-act="rmcart" data-id="${esc(a.id)}">In cart ✓</button>` : `<button class="btn" data-act="add" data-id="${esc(a.id)}">Add to cart</button>`}
      </div>
    </div></article>`;
}
function renderShop(){
  const C = DATA.content;
  $('#shop-title').textContent = C.shopTitle; $('#shop-text').textContent = C.shopText;
  const cats = ['All', ...new Set([...(DATA.collections || []).map(c => c.name), ...DATA.artworks.map(a => a.category)].filter(Boolean))];
  if (!cats.includes(shop.cat)) shop.cat = 'All';
  $('#filters').innerHTML = cats.map(c => `<button class="chip ${c===shop.cat?'active':''}" data-act="cat" data-id="${esc(c)}">${esc(c)}</button>`).join('');
  let list = DATA.artworks.filter(a => (shop.cat==='All' || a.category===shop.cat) &&
    (!shop.q || [a.title,a.category,a.medium,a.description].join(' ').toLowerCase().includes(shop.q)));
  if (shop.sort === 'low') list = [...list].sort((a,b) => a.price - b.price);
  if (shop.sort === 'high') list = [...list].sort((a,b) => b.price - a.price);
  $('#art-grid').innerHTML = list.length ? list.map(card).join('') : `<p class="empty">${shop.cat !== 'All' && !shop.q ? 'No artworks in this collection yet — please check back soon.' : 'No artworks found.'}</p>`;
}

function renderCourses(){
  const S = DATA.settings, C = DATA.content, open = S.coursesOpen;
  $('#courses-title').textContent = open ? C.coursesTitle : C.comingTitle;
  $('#courses-text').textContent = open ? C.coursesText : C.comingText;
  $('#course-grid').innerHTML = DATA.courses.length ? DATA.courses.map(c => `
    <article class="course">
      <span class="level">${esc(c.level)}</span>
      <h3>${esc(c.title)}</h3>
      <p>${esc(c.desc)}</p>
      <ul>${c.points.map(p => `<li>${esc(p)}</li>`).join('')}</ul>
      <div class="row">
        ${open ? `<div><span class="price">${money(c.price)}</span> <span class="small">· ${esc(c.duration)}</span></div>
                  <button class="btn" data-act="enroll" data-id="${esc(c.id)}">Enroll</button>`
               : `<span class="tag">Coming soon</span><button class="btn" data-act="notify" data-id="${esc(c.id)}">Notify me</button>`}
      </div>
    </article>`).join('') : '<p class="empty">No courses yet.</p>';
  $('#courses').style.display = DATA.courses.length || !open ? '' : 'none';
}

function renderContact(){
  const S = DATA.settings, C = DATA.content, wa = (S.whatsapp||'').replace(/\D/g,'');
  $('#contact-title').textContent = C.contactTitle; $('#contact-text').textContent = C.contactText;
  const li = [];
  if (S.email) li.push(`<li>✉️ <a href="mailto:${esc(S.email)}">${esc(S.email)}</a></li>`);
  if (wa) li.push(`<li>💬 <a href="https://wa.me/${wa}" target="_blank" rel="noopener">WhatsApp: +${wa}</a></li>`);
  [['instagram','📷','Instagram'],['facebook','👍','Facebook'],['youtube','▶️','YouTube']].forEach(([k,i,n]) => {
    if (S[k]) li.push(`<li>${i} <a href="${esc(url(S[k]))}" target="_blank" rel="noopener">${n}</a></li>`);
  });
  $('#contact-list').innerHTML = li.join('');
}

/* ---------- cart & ordering ---------- */
let cart = []; try { cart = JSON.parse(localStorage.getItem(CKEY) || '[]'); } catch(e){}
const buyer = {name:'', phone:'', address:'', payment:''};
const payList = () => (DATA.settings.payments || 'Cash on Delivery').split(',').map(x => x.trim()).filter(Boolean);
const saveCart = () => { try { localStorage.setItem(CKEY, JSON.stringify(cart)); } catch(e){} };
function renderCart(){
  cart = cart.filter(id => { const a = findArt(id); return a && a.status !== 'sold'; }); saveCart();
  $('#cart-count').textContent = cart.length;
  const items = cart.map(findArt), total = items.reduce((s,a) => s + Number(a.price), 0);
  $('#cart-body').innerHTML = items.length ? items.map(a => `
    <div class="ci">${a.image ? `<img src="${esc(a.image)}" alt="">` : '<div class="ph"></div>'}
      <div><b>${esc(a.title)}</b><span class="small">${esc(a.category)}</span><br><button class="linkbtn" data-act="rmcart" data-id="${esc(a.id)}">Remove</button></div>
      <span class="price">${money(a.price)}</span></div>`).join('') : '<p class="empty">Your cart is empty. Browse the artworks and tap “Add to cart”.</p>';
  const wa = (DATA.settings.whatsapp||'').replace(/\D/g,'');
  $('#cart-foot').innerHTML = items.length ? `
    <div class="total"><span>Total</span><span>${money(total)}</span></div>
    <input data-buyer="name" placeholder="Your name *" value="${esc(buyer.name)}" autocomplete="name">
    <input data-buyer="phone" placeholder="Phone number *" value="${esc(buyer.phone)}" autocomplete="tel">

const DEFAULT_PASS = 'marzan123';
const hash = (str, seed=0) => { let h1=0xdeadbeef^seed, h2=0x41c6ce57^seed;
  for (let i=0,ch;i<str.length;i++){ ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507); h1^=Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507); h2^=Math.imul(h1^(h1>>>13),3266489909);
  return String(4294967296*(2097151&h2)+(h1>>>0)); };
const passOk = p => DATA.settings.passHash ? hash(p) === DATA.settings.passHash : p === DEFAULT_PASS;

function tabPublish(){
  const kb = Math.round(new Blob([JSON.stringify(DATA)]).size / 1024);
  return `<h3>Publish your changes</h3><p class="ad-sub">Your edits are saved in this browser. To show them to everyone, download the updated website file and upload it to your hosting.</p>
    <div class="ad-card"><p><span class="badge ${dirty?'warn':'ok'}">${dirty ? 'You have changes that are not published yet' : 'Nothing new to publish'}</span> &nbsp; <span class="small">Content size: ${kb.toLocaleString()} KB</span></p>
      <ol class="steps"><li>Press <b>Download updated website</b>. You get a file named <b>index.html</b>.</li>
      <li>Upload that file to your hosting (Netlify, GitHub Pages, Cloudflare Pages…), replacing the old <b>index.html</b>.</li>
      <li>Refresh your website. Everyone now sees your changes.</li></ol>
      <div class="ad-actions"><button class="btn" data-act="export">⬇ Download updated website</button>
      <button class="btn light" data-act="discard">Discard my changes</button></div></div>
    <div class="note">Visitors can never change your shop: your edits only go live when you upload the new file. Keep a copy of every file you download as a backup.</div>`;
}

/* image upload (resize in the browser so the site stays light) */
function readImage(file, max=1100){
  return new Promise((res, rej) => { const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => { const s = Math.min(1, max / Math.max(im.width, im.height)), w = Math.round(im.width*s), h = Math.round(im.height*s);
      const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(im,0,0,w,h);
      URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', .82)); };
    im.onerror = () => rej(new Error('bad image')); im.src = u; });
}

/* export: rebuild the page with the new data inside it */
function exportSite(){
  setCart(false); $('#modal').classList.remove('show');
  const out = clone(DATA); out.version = Date.now();
  const c = document.documentElement.cloneNode(true);
  c.querySelector('#site-data').textContent = JSON.stringify(out).replace(/</g, '\\u003c');
  const rm = s => c.querySelectorAll(s).forEach(e => e.remove());
  rm('#intro');
  ['#admin','#modal','#cart-body','#cart-foot','#toast','#art-grid','#col-grid','#stu-grid','#filters','#course-grid','#contact-list','#about-text','#about-stats','#hero-actions','#hero-art','#hero-title'].forEach(s => { const e = c.querySelector(s); if (e) e.innerHTML = ''; });
  c.querySelector('#admin').className = ''; c.querySelector('#modal').className = 'modal'; c.querySelector('#drawer').className = 'drawer'; c.querySelector('#scrim').className = 'scrim';
  c.querySelector('#toast').className = 'toast'; c.querySelector('#modal').removeAttribute('data-cur');
  c.querySelectorAll('.reveal.in').forEach(e => e.classList.remove('in'));
  c.querySelectorAll('#menu.open').forEach(e => e.classList.remove('open'));
  const b = c.querySelector('body'); b.removeAttribute('class'); b.removeAttribute('style');
  const html = '<!DOCTYPE html>\n' + c.outerHTML;
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([html], {type:'text/html'})); a.download = 'index.html';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('Downloaded! Now upload index.html to your hosting.');
}

/* ---------- actions ---------- */
const blankArt = () => ({id:'', title:'', price:'', status:'available', category:'', medium:'', description:'', image:''});
const blankCol = () => ({id:'', name:'', desc:'', image:'', old:''});
const blankStu = () => ({id:'', name:'', title:'', course:'', note:'', image:''});
const blankRev = () => ({id:'', artId:(DATA.artworks[0] || {}).id || '', name:'', stars:'5', text:''});
const blankCourse = () => ({id:'', title:'', level:'', desc:'', points:'', price:'', duration:''});
const move = (arr, i, d) => { const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; };
const ACT = {
  'add': id => { if (!cart.includes(id)) cart.push(id); saveCart(); refreshStore(); toast('Added to your cart'); },
  'rmcart': id => { cart = cart.filter(x => x !== id); saveCart(); refreshStore(); },
  'open': id => openProduct(id),
  'cat': id => { shop.cat = id; renderShop(); },
  'cart-open': () => { $('#modal').classList.remove('show'); renderCart(); setCart(true); },
  'close-cart': () => setCart(false),
  'close-modal': (id, el, e) => { if (e.target === el) $('#modal').classList.remove('show'); },
  'clear-cart': () => { cart = []; saveCart(); refreshStore(); },
  'order-wa': () => sendOrder('wa'),
  'order-mail': () => sendOrder('mail'),
  'enroll': id => { const c = findCourse(id); location.href = `mailto:${DATA.settings.email}?subject=${encodeURIComponent('Course enrollment: ' + c.title)}&body=${encodeURIComponent('Hi, I would like to join "' + c.title + '". Please send me the details.')}`; },
  'notify': id => { const c = findCourse(id); location.href = `mailto:${DATA.settings.email}?subject=${encodeURIComponent('Notify me: ' + c.title)}&body=${encodeURIComponent('Hi, please let me know when "' + c.title + '" opens.')}`; },

  'ad-login': () => { const p = $('#ad-pass').value; if (passOk(p)) { authed = true; try { sessionStorage.setItem('marzan-admin','1'); } catch(e){} renderAdmin(); } else toast('Wrong password.'); },
  'ad-exit': () => closeAdmin(),
  'ad-logout': () => { authed = false; try { sessionStorage.removeItem('marzan-admin'); } catch(e){} closeAdmin(); },
  'ad-tab': id => { AD.tab = id; AD.editing = AD.cedit = AD.colEdit = AD.sedit = AD.redit = null; renderAdmin(); },
  'art-new': () => { AD.editing = 'new'; AD.form = blankArt(); renderAdmin(); },
  'art-edit': id => { AD.editing = id; AD.form = clone(findArt(id)); renderAdmin(); },
  'art-cancel': () => { AD.editing = null; renderAdmin(); },
  'art-save': () => {
    const f = AD.form, price = Number(f.price);
    if (!String(f.title).trim()) return toast('Please enter a title.');
    if (f.price === '' || isNaN(price) || price < 0) return toast('Please enter a valid price.');
    const rec = {id:f.id, title:String(f.title).trim(), price, status:f.status, category:String(f.category).trim() || 'Artwork', medium:f.medium, description:f.description, image:f.image};
    if (AD.editing === 'new') { rec.id = 'a' + Date.now(); DATA.artworks.unshift(rec); }
    else DATA.artworks[DATA.artworks.findIndex(a => a.id === rec.id)] = rec;
    AD.editing = null; commit(); renderAdmin(); toast('Artwork saved');
  },
  'art-del': id => { const a = findArt(id); if (confirm(`Delete “${a.title}”? This cannot be undone (unless you discard your changes before publishing).`)) { DATA.artworks = DATA.artworks.filter(x => x.id !== id); commit(); renderAdmin(); } },
  'art-up': id => { move(DATA.artworks, DATA.artworks.findIndex(a => a.id === id), -1); commit(); renderAdmin(); },
  'art-down': id => { move(DATA.artworks, DATA.artworks.findIndex(a => a.id === id), 1); commit(); renderAdmin(); },
  'col-go': id => { const c = (DATA.collections || []).find(x => x.id === id); if (!c) return; shop.cat = c.name; shop.q = ''; $('#shop-search').value = ''; renderShop(); $('#artworks').scrollIntoView({behavior:'smooth'}); },
  'col-new': () => { AD.colEdit = 'new'; AD.colForm = blankCol(); renderAdmin(); },
  'col-edit': id => { AD.colEdit = id; AD.colForm = clone(DATA.collections.find(c => c.id === id)); AD.colForm.old = AD.colForm.name; renderAdmin(); },
  'col-cancel': () => { AD.colEdit = null; renderAdmin(); },
  'col-rmimg': () => { AD.colForm.image = ''; renderAdmin(); },
  'col-save': () => {
    const f = AD.colForm, name = String(f.name).trim();
    if (!name) return toast('Please enter a name.');
    if (DATA.collections.some(c => c.id !== f.id && c.name.toLowerCase() === name.toLowerCase())) return toast('You already have a collection with that name.');
    const rec = {id:f.id, name, desc:f.desc, image:f.image};
    if (AD.colEdit === 'new') { rec.id = 'col' + Date.now(); DATA.collections.push(rec); }
    else { const old = f.old; DATA.collections[DATA.collections.findIndex(c => c.id === rec.id)] = rec;
      if (old && old !== name) DATA.artworks.forEach(a => { if (a.category === old) a.category = name; }); }
    AD.colEdit = null; commit(); renderAdmin(); toast('Collection saved');
  },
  'col-del': id => { const c = DATA.collections.find(x => x.id === id); if (confirm(`Delete the collection “${c.name}”? Your paintings are not deleted.`)) { DATA.collections = DATA.collections.filter(x => x.id !== id); commit(); renderAdmin(); } },
  'col-up': id => { move(DATA.collections, DATA.collections.findIndex(c => c.id === id), -1); commit(); renderAdmin(); },
  'col-down': id => { move(DATA.collections, DATA.collections.findIndex(c => c.id === id), 1); commit(); renderAdmin(); },
  'crs-new': () => { AD.cedit = 'new'; AD.cform = blankCourse(); renderAdmin(); },
  'crs-edit': id => { const c = clone(findCourse(id)); c.points = c.points.join('\n'); AD.cedit = id; AD.cform = c; renderAdmin(); },
  'crs-cancel': () => { AD.cedit = null; renderAdmin(); },
  'crs-save': () => {
    const f = AD.cform; if (!String(f.title).trim()) return toast('Please enter a title.');
    const rec = {id:f.id, title:f.title.trim(), level:f.level, desc:f.desc, points:String(f.points).split('\n').map(s => s.trim()).filter(Boolean), price:Number(f.price) || 0, duration:f.duration};
    if (AD.cedit === 'new') { rec.id = 'c' + Date.now(); DATA.courses.push(rec); }
    else DATA.courses[DATA.courses.findIndex(c => c.id === rec.id)] = rec;
    AD.cedit = null; commit(); renderAdmin(); toast('Course saved');
  },
  'crs-del': id => { const c = findCourse(id); if (confirm(`Delete the course “${c.title}”?`)) { DATA.courses = DATA.courses.filter(x => x.id !== id); commit(); renderAdmin(); } },
  'rev-open': id => { rev.open = true; rev.for = id; rev.stars = 5; openProduct(id); },
  'rev-cancel': () => { rev.open = false; openProduct($('#modal').dataset.cur); },
  'rev-star': n => { rev.stars = Number(n); openProduct($('#modal').dataset.cur); },
  'rev-send': id => {
    if (!rev.name.trim()) return toast('Please enter your name.');
    const a = findArt(id), t = `New review for "${a.title}"\nRating: ${rev.stars}/5\nName: ${rev.name.trim()}\nReview: ${rev.text.trim() || '-'}\n\n(Add it in Admin → Reviews to show it on the website.)`;
    const wa = (DATA.settings.whatsapp || '').replace(/\D/g,'');
    if (wa) window.open(`https://wa.me/${wa}?text=${encodeURIComponent(t)}`, '_blank');
    else location.href = `mailto:${DATA.settings.email}?subject=${encodeURIComponent('New review: ' + a.title)}&body=${encodeURIComponent(t)}`;
    rev.open = false; rev.text = ''; openProduct(id); toast('Thank you! Your review was sent to the artist.');
  },
  'stu-open': id => { const s = DATA.students.find(x => x.id === id); if (!s) return;
    $('#modal').innerHTML = `<div class="modal-card"><div class="mi">${s.image ? `<img src="${esc(s.image)}" alt="${esc(s.title || 'Student artwork')}">` : PH}</div><div class="mt">
      <button class="x" data-act="close-modal" style="align-self:flex-end" aria-label="Close">×</button>
      <span class="tag">${esc(s.course || 'Student artwork')}</span><h3>${esc(s.title || 'Untitled')}</h3><span class="meta small">by ${esc(s.name)}</span>${s.note ? `<p>${esc(s.note)}</p>` : ''}</div></div>`;
    $('#modal').classList.add('show'); $('#modal').dataset.cur = 'stu:' + id; },
  'stu-new': () => { AD.sedit = 'new'; AD.sform = blankStu(); renderAdmin(); },
  'stu-edit': id => { AD.sedit = id; AD.sform = clone(DATA.students.find(x => x.id === id)); renderAdmin(); },
  'stu-cancel': () => { AD.sedit = null; renderAdmin(); },
  'stu-save': () => {
    const f = AD.sform; if (!String(f.name).trim()) return toast('Please enter the student name.');
    if (!f.image) return toast('Please add a photo of the artwork.');
    const rec = {id:f.id, name:f.name.trim(), title:f.title, course:f.course, note:f.note, image:f.image};
    if (AD.sedit === 'new') { rec.id = 's' + Date.now(); DATA.students.unshift(rec); }
    else DATA.students[DATA.students.findIndex(x => x.id === rec.id)] = rec;
    AD.sedit = null; commit(); renderAdmin(); toast('Saved');
  },
  'stu-del': id => { if (confirm('Delete this student artwork?')) { DATA.students = DATA.students.filter(x => x.id !== id); commit(); renderAdmin(); } },
  'stu-up': id => { move(DATA.students, DATA.students.findIndex(x => x.id === id), -1); commit(); renderAdmin(); },
  'stu-down': id => { move(DATA.students, DATA.students.findIndex(x => x.id === id), 1); commit(); renderAdmin(); },
  'rev-new': () => { AD.redit = 'new'; AD.rform = blankRev(); renderAdmin(); },
  'rev-edit': id => { AD.redit = id; AD.rform = clone(DATA.reviews.find(x => x.id === id)); AD.rform.stars = String(AD.rform.stars); renderAdmin(); },
  'rev-cancel-admin': () => { AD.redit = null; renderAdmin(); },
  'rev-save': () => {
    const f = AD.rform; if (!findArt(f.artId)) return toast('Please choose an artwork.'); if (!String(f.name).trim()) return toast('Please enter the reviewer name.');
    const rec = {id:f.id, artId:f.artId, name:f.name.trim(), stars:Math.min(5, Math.max(1, Number(f.stars) || 5)), text:f.text, date:f.date || new Date().toISOString().slice(0,10)};
    if (AD.redit === 'new') { rec.id = 'r' + Date.now(); DATA.reviews.push(rec); }
    else DATA.reviews[DATA.reviews.findIndex(x => x.id === rec.id)] = rec;
    AD.redit = null; commit(); renderAdmin(); toast('Review saved');
  },
  'rev-del': id => { if (confirm('Delete this review?')) { DATA.reviews = DATA.reviews.filter(x => x.id !== id); commit(); renderAdmin(); } },
  'hero-rm': () => { DATA.content.heroImage = ''; commit(); renderAdmin(); },
  'pw-save': () => { const a = $('#pw1').value, b = $('#pw2').value;
    if (a.length < 6) return toast('Use at least 6 characters.'); if (a !== b) return toast('The two passwords do not match.');
    DATA.settings.passHash = hash(a); commit(); renderAdmin(); toast('Password changed. Download & upload the website to keep it.'); },
  'export': () => exportSite(),
  'discard': () => { if (confirm('Throw away all changes you made and go back to the published version?')) { try { localStorage.removeItem(DKEY); } catch(e){} DATA = clone(BASE); ensure(); dirty = false; AD.editing = AD.cedit = AD.colEdit = null; renderSite(); renderAdmin(); toast('Changes discarded'); } }
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && ACT[el.dataset.act]) ACT[el.dataset.act](el.dataset.id, el, e); });

/* inputs */
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.buyer) buyer[t.dataset.buyer] = t.value;
  else if (t.dataset.rev) rev[t.dataset.rev] = t.value;
  else if (t.dataset.f) { const f = t.dataset.f; if (f === 'imageUrl') { if (t.value.trim()) { AD.form.image = t.value.trim(); const p = $('#photo-prev'); p.src = AD.form.image; p.style.visibility = 'visible'; } }
    else (AD.sedit ? AD.sform : AD.redit ? AD.rform : AD.colEdit ? AD.colForm : AD.form && AD.editing ? AD.form : AD.cform)[f] = t.value; }
  else if (t.dataset.k) { setPath(DATA, t.dataset.k, t.type === 'checkbox' ? t.checked : t.value); commit(); }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.k && t.type === 'checkbox') { setPath(DATA, t.dataset.k, t.checked); commit(); }
  else if (t.dataset.price) { const a = findArt(t.dataset.price); a.price = Math.max(0, Number(t.value) || 0); commit(); toast('Price updated'); }
  else if (t.dataset.status) { findArt(t.dataset.status).status = t.value; commit(); renderAdmin(); }
  else if (t.id === 'ad-photo' || t.id === 'ad-hero' || t.id === 'ad-colphoto' || t.id === 'ad-stuphoto') {
    const file = t.files && t.files[0]; if (!file) return;
    try { const d = await readImage(file, t.id === 'ad-hero' ? 1000 : 1100);
      if (t.id === 'ad-photo') { AD.form.image = d; const p = $('#photo-prev'); p.src = d; p.style.visibility = 'visible'; }
      else if (t.id === 'ad-colphoto') { AD.colForm.image = d; renderAdmin(); }
      else if (t.id === 'ad-stuphoto') { AD.sform.image = d; renderAdmin(); }
      else { DATA.content.heroImage = d; commit(); renderAdmin(); } }
    catch(err){ toast('Sorry, that photo could not be read. Try a JPG or PNG.'); }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { $('#modal').classList.remove('show'); setCart(false); }
  if (e.key === 'Enter' && e.target.id === 'ad-pass') ACT['ad-login']();
});
$('#shop-search').addEventListener('input', e => { shop.q = e.target.value.trim().toLowerCase(); renderShop(); });
$('#shop-sort').addEventListener('change', e => { shop.sort = e.target.value; renderShop(); });
$('#contact-form').addEventListener('submit', e => {
  e.preventDefault(); const f = new FormData(e.target);
  location.href = `mailto:${DATA.settings.email}?subject=${encodeURIComponent(f.get('topic') + ' — ' + f.get('name'))}&body=${encodeURIComponent(f.get('message') + '\n\nFrom: ' + f.get('name') + ' (' + f.get('email') + ')')}`;
});
window.addEventListener('hashchange', () => { if (location.hash === '#admin') openAdmin(); });

/* ---------- start ---------- */
renderSite();
const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add('in'); io.unobserve(x.target); } }), {threshold:.12});
$$('.reveal').forEach(el => io.observe(el));
if (location.hash === '#admin') { const i = $('#intro'); if (i) i.remove(); openAdmin(); }
else setTimeout(() => { const el = $('#intro'); if (el) { el.classList.add('hide'); setTimeout(() => el.remove(), 1000); } }, 1900);
})();
</script>
